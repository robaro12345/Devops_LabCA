apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: k8s-demo
  labels:
    app: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: omkarvbhoir/express-k8s-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PORT
              value: "5000"
            - name: APP_VERSION
              value: "1.0.0"
            - name: FAIL_HEALTH_CHECK
              value: "false"
            # Expose the Pod name to the application using Kubernetes Downward API
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # Liveness Probe: Checks if the container is alive. If it fails, Kubernetes restarts it.
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness Probe: Checks if the container is ready to serve traffic. If it fails, traffic is diverted.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
