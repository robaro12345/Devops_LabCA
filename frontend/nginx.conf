server {
    listen 80;
    server_name localhost;

    # Serve static React production build
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy for standalone Docker testing
    # Note:
    # 1. Local Docker / Compose: Forwards /api/ to http://backend:5000/api/ via Docker's embedded DNS (127.0.0.11).
    # 2. Kubernetes Production: Kubernetes Ingress routes /api directly to backend-service at the cluster edge,
    #    so Ingress bypasses this Nginx container for /api.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
